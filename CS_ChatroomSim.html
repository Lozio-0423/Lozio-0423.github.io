<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日本語チャット練習 - さくら光ネット</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap');
        body {
            font-family: 'Noto Sans JP', sans-serif;
            background-color: #f0f2f5;
        }
        .chat-bubble {
            position: relative;
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 0.95rem;
            line-height: 1.5;
            word-wrap: break-word;
        }
        .chat-bubble.user {
            background-color: #0084ff;
            color: white;
            border-bottom-right-radius: 2px;
            margin-left: auto;
        }
        .chat-bubble.ai {
            background-color: white;
            color: #1c1e21;
            border-bottom-left-radius: 2px;
            margin-right: auto;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }
        .typing-dot {
            width: 6px;
            height: 6px;
            background-color: #b0b3b8;
            border-radius: 50%;
            animation: typing 1.4s infinite ease-in-out both;
            margin: 0 2px;
        }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes typing {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
        /* Custom scrollbar */
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- API Handling ---
        const apiKey = ""; // Running in environment with key injection

        async function generateAIResponse(history, userLevel) {
            // Exponential backoff logic is handled in the caller or simple retry here if needed, 
            // but for this snippet we'll assume standard call.
            
            const systemPrompt = `
            あなたは日本のインターネットプロバイダー「さくら光ネット」のカスタマーサポート担当者「佐藤」です。
            相手は日本語学習者です。
            
            【役割】
            インターネット契約に関する問い合わせ（新規契約、解約、プラン変更、引越し手続きなど）に対応してください。
            
            【重要：言語レベルの調整】
            相手の日本語レベル（${userLevel}）に合わせて、あなたの言葉遣いを調整してください。
            - 初級 (Beginner): 漢字を減らし、非常に簡単な言葉を使ってください。敬語は「です・ます」のみに留め、尊敬語・謙譲語は避けてください。
            - 中級 (Intermediate): 一般的な丁寧語を使ってください。難しい専門用語は避けてください。
            - 上級 (Advanced): 日本のビジネスシーンとして自然な、正しい敬語（尊敬語・謙譲語）を使ってください。

            【重要：エラーへの反応】
            相手の日本語が文法的に間違っていたり、意味が通じない場合、絶対に「なんとなく察して」返事をしないでください。
            困った様子を見せたり、聞き返したりしてください。
            例：「申し訳ありません、電波が悪かったようです。もう一度お願いできますか？」
            例：「『〜』というのは、XXのことでしょうか？」
            例：「すみません、よく分かりませんでした。」

            【振る舞い】
            - 常に丁寧ですが、相手が間違っているときは優しく指摘するか、困ったふりをしてください。
            - 1回の返答は長すぎないように（スマホチャットなので）。
            `;

            const contents = [
                {
                    role: "model",
                    parts: [{ text: systemPrompt }]
                },
                ...history.map(msg => ({
                    role: msg.role === 'user' ? 'user' : 'model',
                    parts: [{ text: msg.text }]
                }))
            ];

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents })
                });

                const data = await response.json();
                if (data.error) throw new Error(data.error.message);
                return data.candidates[0].content.parts[0].text;
            } catch (error) {
                console.error("API Error:", error);
                return "申し訳ありません。システムエラーが発生しました。もう一度お試しください。";
            }
        }

        // --- Components ---

        const Header = ({ level, setLevel, onReset }) => (
            <div className="bg-white border-b border-gray-200 p-4 sticky top-0 z-10 shadow-sm flex justify-between items-center">
                <div className="flex items-center gap-3">
                    <div className="w-10 h-10 rounded-full bg-pink-100 flex items-center justify-center text-pink-600">
                        <i className="fa-solid fa-headset text-xl"></i>
                    </div>
                    <div>
                        <h1 className="font-bold text-gray-800 text-sm md:text-base">さくら光ネット サポート</h1>
                        <div className="flex items-center text-xs text-green-500">
                            <span className="w-2 h-2 bg-green-500 rounded-full mr-1"></span>
                            オンライン (佐藤)
                        </div>
                    </div>
                </div>
                <div className="flex items-center gap-2">
                    <select 
                        value={level} 
                        onChange={(e) => setLevel(e.target.value)}
                        className="text-xs bg-gray-50 border border-gray-300 rounded px-2 py-1 outline-none focus:border-pink-400"
                    >
                        <option value="Beginner">初級 (N4-N5)</option>
                        <option value="Intermediate">中級 (N3)</option>
                        <option value="Advanced">上級 (N1-N2)</option>
                    </select>
                    <button onClick={onReset} className="text-gray-400 hover:text-gray-600 px-2">
                        <i className="fa-solid fa-rotate-right"></i>
                    </button>
                </div>
            </div>
        );

        const MessageList = ({ messages, isTyping, messagesEndRef }) => (
            <div className="flex-1 overflow-y-auto p-4 space-y-4 bg-[#eef0f3]">
                <div className="text-center text-xs text-gray-400 my-4">
                    本日はさくら光ネットにお問い合わせいただきありがとうございます。<br/>
                    ご用件を入力してください。
                </div>
                
                {messages.map((msg, index) => (
                    <div key={index} className={`flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                        {msg.role === 'ai' && (
                            <div className="w-8 h-8 rounded-full bg-pink-100 flex-shrink-0 mr-2 flex items-center justify-center text-pink-600 text-xs overflow-hidden">
                                <img src="https://api.dicebear.com/9.x/micah/svg?seed=Sato&backgroundColor=ffd5dc" alt="Sato" className="w-full h-full"/>
                            </div>
                        )}
                        <div className={`chat-bubble ${msg.role} shadow-sm`}>
                            {msg.text}
                        </div>
                    </div>
                ))}
                
                {isTyping && (
                    <div className="flex justify-start">
                        <div className="w-8 h-8 rounded-full bg-pink-100 flex-shrink-0 mr-2 flex items-center justify-center text-pink-600 text-xs overflow-hidden">
                            <img src="https://api.dicebear.com/9.x/micah/svg?seed=Sato&backgroundColor=ffd5dc" alt="Sato" className="w-full h-full"/>
                        </div>
                        <div className="chat-bubble ai flex items-center h-10">
                            <div className="typing-dot"></div>
                            <div className="typing-dot"></div>
                            <div className="typing-dot"></div>
                        </div>
                    </div>
                )}
                <div ref={messagesEndRef} />
            </div>
        );

        const InputArea = ({ input, setInput, onSend, isTyping }) => (
            <div className="bg-white p-3 border-t border-gray-200">
                <form 
                    onSubmit={(e) => { e.preventDefault(); onSend(); }}
                    className="flex items-end gap-2 max-w-4xl mx-auto"
                >
                    <div className="flex-1 bg-gray-100 rounded-2xl px-4 py-2 focus-within:bg-white focus-within:ring-2 focus-within:ring-pink-100 transition-all">
                        <input
                            type="text"
                            value={input}
                            onChange={(e) => setInput(e.target.value)}
                            placeholder="メッセージを入力..."
                            className="w-full bg-transparent border-none outline-none text-sm md:text-base py-1"
                            disabled={isTyping}
                        />
                    </div>
                    <button 
                        type="submit" 
                        disabled={!input.trim() || isTyping}
                        className={`w-10 h-10 rounded-full flex items-center justify-center transition-colors ${
                            !input.trim() || isTyping 
                                ? 'bg-gray-200 text-gray-400 cursor-not-allowed' 
                                : 'bg-blue-500 text-white hover:bg-blue-600 shadow-md'
                        }`}
                    >
                        <i className="fa-solid fa-paper-plane text-sm"></i>
                    </button>
                </form>
            </div>
        );

        const App = () => {
            const [messages, setMessages] = useState([
                { role: 'ai', text: 'お電話ありがとうございます、さくら光ネットの佐藤です。本日はどのようなご用件でしょうか？' }
            ]);
            const [input, setInput] = useState('');
            const [isTyping, setIsTyping] = useState(false);
            const [level, setLevel] = useState('Intermediate');
            const messagesEndRef = useRef(null);

            const scrollToBottom = () => {
                messagesEndRef.current?.scrollIntoView({ behavior: "smooth" });
            };

            useEffect(() => {
                scrollToBottom();
            }, [messages, isTyping]);

            const handleSend = async () => {
                if (!input.trim()) return;

                const userText = input;
                setInput('');
                
                const newMessages = [...messages, { role: 'user', text: userText }];
                setMessages(newMessages);
                setIsTyping(true);

                // Generate AI response
                // We only send the last few messages to save context window and keep focus relevant
                const contextHistory = newMessages.slice(-6); 
                const aiText = await generateAIResponse(contextHistory, level);

                setIsTyping(false);
                setMessages(prev => [...prev, { role: 'ai', text: aiText }]);
            };

            const handleReset = () => {
                if(confirm("チャットをリセットしますか？")) {
                    setMessages([{ role: 'ai', text: 'お電話ありがとうございます、さくら光ネットの佐藤です。本日はどのようなご用件でしょうか？' }]);
                    setInput('');
                }
            };

            return (
                <div className="flex flex-col h-screen max-w-md mx-auto bg-white shadow-xl overflow-hidden md:rounded-xl md:my-4 md:h-[95vh] border border-gray-200">
                    <Header level={level} setLevel={setLevel} onReset={handleReset} />
                    <MessageList messages={messages} isTyping={isTyping} messagesEndRef={messagesEndRef} />
                    <InputArea input={input} setInput={setInput} onSend={handleSend} isTyping={isTyping} />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
